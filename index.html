<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Visualization</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Solar System Visualization</h1>
            <p class="subtitle">Interactive 3D Model of Our Solar System</p>
        </header>
        
        <div class="controls">
            <div class="control-group">
                <label for="speed">Speed:</label>
                <input type="range" id="speed" min="0.1" max="10" step="0.1" value="1">
                <span id="speed-value">1x</span>
            </div>
            <div class="control-group">
                <button id="toggle-orbit">Pause Orbits</button>
            </div>
            <div class="control-group">
                <label for="show-labels">Show Labels:</label>
                <input type="checkbox" id="show-labels" checked>
            </div>
            <div class="control-group">
                <label for="show-orbits">Show Orbits:</label>
                <input type="checkbox" id="show-orbits" checked>
            </div>
        </div>
        
        <div id="solar-system"></div>
        
        <div class="info-panel">
            <h2>Planet Information</h2>
            <div id="planet-info">
                <p>Hover over a planet to see details</p>
            </div>
        </div>
    </div>
    
    <script src="solar-system.js"></script>
</body>
</html>
